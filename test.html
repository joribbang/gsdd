<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1320" />
  <title>한 잔 추천받기 | 경상동동</title>

  <!-- Pretendard -->
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />

  <style>
    :root{
      --ink:#5C3A21; --sub:#9B7B64; --paper:#FFFAED;
      --btn:#5C3A21; --btn-ink:#F1E7D0; --accent:#A9CAD1;
      --pct:0;

      /* 프레임 높이(전환용) */
      --frameH-ask: 560px;                 /* 질문 단계: 짧게 */
      --frameH-result: calc(100vh - 210px); /* 결과 단계: 패딩(32*2) 제외 풀높이 */
    }
    *{ box-sizing:border-box }
    html,body{ height:100% }

    /* 배경 */
    body{
      margin:0;
      font:400 18px Pretendard,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--ink);
      overflow:hidden;
      background:#EB8A00;
      background-image:radial-gradient(circle, #F1E7D0, #E6D3B3);
    }

    /* 레이아웃 */
    .shell{ position:fixed; inset:0; padding:32px; overflow:visible; position:relative; }
    .frame{
      width:min(868px, 92vw);
      height:var(--frameH-ask);                 /* 기본: 질문 높이 */
      min-height:520px;
      background:var(--paper);
      border-radius:32px;
      box-shadow:20px 20px 60px rgba(92,58,33,.25);
      display:flex; flex-direction:column; position:relative; z-index:2;
      margin:0 auto;
      transition:height .55s cubic-bezier(.2,.7,.2,1);
    }
    .frame.is-result{ height:var(--frameH-result); } /* 결과에서 늘어남 */

    /* 상단바 */
    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      padding:20px 24px; border-bottom:1px solid rgba(92,58,33,.12);
    }
    .brand{ display:flex; align-items:center; gap:12px; font-weight:700 }
    .close{ appearance:none; border:none; background:#DDD3BD; color:var(--ink);
      width:40px; height:40px; border-radius:50%; cursor:pointer; }
/* Close(X) hover / focus 효과 - 진한 톤 버전 */
.close{
  position: relative;
  transition: transform .18s ease, box-shadow .25s ease, background-color .25s ease;
  outline: none;
}
.close::after{
  content:"";
  position:absolute; inset:-6px; border-radius:50%;
  border:1.5px solid rgba(92,58,33,.35); /* 테두리 진하게 */
  transform:scale(.86); opacity:0;
  transition:opacity .28s ease, transform .28s ease;
  pointer-events:none;
}
.close:hover{
  background:#5C3A21;                  /* 진한 갈색 배경 */
  color:#F1E7D0;                        /* 버튼 잉크 색상 */
  transform:translateY(-1px);
  box-shadow:0 10px 22px rgba(92,58,33,.35);
}
.close:hover::after{
  opacity:1; transform:scale(1);
}
.close:active{
  transform:translateY(0);
  box-shadow:0 6px 14px rgba(92,58,33,.32);
}
.close:focus-visible{
  box-shadow:0 0 0 3px rgba(92,58,33,.6), 0 6px 16px rgba(92,58,33,.35);
}

    /* 진행바(잔) */
    .progress{ display:flex; justify-content:center; align-items:center; padding-top:35px; }
    .progress-svg{ width:70px; height:auto; overflow:visible; }
    .progress-svg [data-base]{ fill:#5C3A21; stroke:none; }
    .progress-svg [data-fill]{ fill:#F1E7D0; stroke:#F1E7D0; stroke-width:1; paint-order:stroke; vector-effect:non-scaling-stroke; }
    .progress-svg [data-level]{ transform-box:fill-box; transform-origin:50% 100%;
      transform:scaleY(calc(var(--pct)/100)); transition:transform .6s ease; }
    .progress-svg [data-outline]{ fill:none; stroke:#5C3A21; stroke-width:1.25;
      stroke-linejoin:round; stroke-linecap:round; vector-effect:non-scaling-stroke; }

    /* 스테이지/패널 */
    .stage{ flex:1; display:grid; place-items:center; position:relative; overflow:hidden; }
    .panel{
      --y:50%;
      width:min(760px, 88%);
      position:absolute; left:50%; top:var(--y);
      transform:translate(-50%,-50%);
      opacity:0; pointer-events:none;
    }
    .panel.show{ opacity:1; pointer-events:auto; }

    /* 질문 패널은 위로, 결과는 중앙 */
    #q1, #q2{ --y:48%; }
    #result{ --y:50%; }

    /* 질문 전환 애니 */
    .flip-in{ animation:flipIn .6s cubic-bezier(.2,.7,.2,1) both; transform-origin:right center; }
    .flip-out{ animation:flipOut .6s cubic-bezier(.2,.7,.2,1) both; transform-origin:left center; }
    @keyframes flipIn{
      0%{transform:translate(-50%,-50%) rotateY(-80deg)}
      60%{transform:translate(-50%,-50%) rotateY(8deg)}
      100%{transform:translate(-50%,-50%) rotateY(0)}
    }
    @keyframes flipOut{
      0%{transform:translate(-50%,-50%) rotateY(0)}
      100%{transform:translate(-50%,-50%) rotateY(80deg)}
    }

    /* 결과 카드 자동 축소 */
    #result .fitbox{
      transform-origin:top center; will-change:transform;
      transition:transform .45s cubic-bezier(.2,.7,.2,1); /* 스케일 변화도 부드럽게 */
    }

    /* 질문/선택지 */
    .q-title{ font:600 34px "Chosunilbo_myungjo"; margin:0 0 18px }
    .q-desc{ color:#7c5f48; margin:0 0 28px }
    .choices{ display:grid; gap:16px }
    .choice{
      border:1px solid rgba(92,58,33,.16); background:#fff; border-radius:16px;
      padding:18px; text-align:left; cursor:pointer;
      transition:transform .15s ease, box-shadow .15s ease;
    }
    .choice:hover{ transform:translateY(-2px); box-shadow:0 8px 18px rgba(92,58,33,.10) }
    .choice:active{ transform:translateY(0.5px) }

    /* 로딩(복구: 점 bounce) */
    .loading{ display:grid; place-items:center; gap:20px; padding:40px 0; text-align:center; }
    .dots{ display:inline-grid; grid-auto-flow:column; gap:8px;
    padding-top: 20px; }
    .dot{
      width:10px; height:10px; border-radius:50%;
      background:linear-gradient(135deg, #8B5A2B, #C4A484); opacity:.45; animation:bounce 1.2s infinite;
    }
    .dot:nth-child(2){ animation-delay:.15s; }
    .dot:nth-child(3){ animation-delay:.3s; }
    @keyframes bounce{
      0%,100%{ transform:translateY(0); opacity:.45; }
      50%{ transform:translateY(-8px); opacity:1; }
    }

    /* 결과 카드 */
    .result-card{
      display:grid; grid-template-columns: 220px 1fr; gap:24px; align-items:center;
      background:#fff; border:1px solid rgba(92,58,33,.12); border-radius:24px; padding:26px;
      box-shadow:0 10px 30px rgba(92,58,33,.10);
    }
    .bottle{ width:100%; aspect-ratio:3/6; display:grid; place-items:center;
 }
    .bottle img{ max-width:78%; height:auto; display:block }
    .r-title{ font:700 28px/1.2 Pretendard; margin:0 0 12px }
    .r-tags{ display:flex; gap:8px; margin:10px 0 16px }
    .tag{ font:600 13px; color:#fff; background:#A05C5C; padding:6px 12px; border-radius:999px }
    .r-desc{ line-height:1.7; color:#593f28 }
    .actions{ display:flex; gap:10px; margin-top:20px }
    .btn{ appearance:none; border:none; border-radius:999px; padding:12px 18px; cursor:pointer; font-weight:700 }
    .btn.primary{ background:var(--btn); color:var(--btn-ink) }
    .btn.ghost{ background:transparent; border:1px solid rgba(92,58,33,.25); color:var(--ink) }
    .btn:active{ transform:translateY(1px) }
  </style>
</head>
<body>
  <div class="shell" role="dialog" aria-modal="true" aria-label="막걸리 추천 테스트">
    <!-- 버블 캔버스는 JS로 추가됩니다 -->

    <div class="frame" id="frame">
      <div class="topbar">
        <div class="brand"><span>나에게 딱 맞는 경상도 막걸리는?</span></div>
        <button class="close" aria-label="닫기" onclick="window.history.back()">✕</button>
      </div>

      <!-- 진행바 -->
      <div class="progress" aria-hidden="true">
        <svg class="progress-svg" viewBox="0 0 185.69 103.83"
             xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
          <defs>
            <path id="bowlPath"
                  d="M92.84,0C46.55,0,0,3,0,13.14,0,41,11.45,68.48,32.35,86.64
                     c15.09,13.1,36.31,17.19,60.49,17.19s45.41-4.09,60.49-17.19
                     c20.91-18.16,32.36-45.65,32.36-73.5C185.69,3,139.13,0,92.84,0Z"/>
            <clipPath id="bowlClip"><use href="#bowlPath"/></clipPath>
          </defs>
          <use href="#bowlPath" data-base/>
          <g clip-path="url(#bowlClip)">
            <rect data-fill data-level x="-3" y="-3" width="192" height="112"/>
          </g>
          <use href="#bowlPath" data-outline/>
        </svg>
      </div>

      <main class="stage">
        <!-- Q1 -->
        <section id="q1" class="panel show flip-in" aria-live="polite">
          <h2 class="q-title">오늘은 어떤 분위기에서 마시고 싶나요?</h2>
          <p class="q-desc">지금 떠오르는 장면을 상상하며 골라보세요.</p>
          <div class="choices">
            <button class="choice" data-next="q2">잔잔한 파도 소리가 들리는 바닷가</button>
            <button class="choice" data-next="q2">나무 향기 솔솔 나는 한옥 마루</button>
            <button class="choice" data-next="q2">새소리와 바람소리 들리는 조용한 산 속 정자</button>
          </div>
        </section>

        <!-- Q2 -->
        <section id="q2" class="panel" aria-live="polite">
          <h2 class="q-title">첫 모금에 바라는 느낌은?</h2>
          <p class="q-desc">막걸리와 함께 시작되는 첫인상, 어떤 느낌을 원하시나요?</p>
          <div class="choices">
            <button class="choice" data-next="loading">톡 쏘는 청량감</button>
            <button class="choice" data-next="loading">부드럽고 달큰함</button>
            <button class="choice" data-next="loading">담백하고 깔끔함</button>
          </div>
        </section>

        <!-- Loading -->
        <section id="loading" class="panel" aria-live="polite" aria-busy="true">
          <div class="loading">
            <div style="font-weight:700">취향 분석 중…</div>
            <div style="color:#7c5f48">당신 취향의 한 잔을 찾아내는 중입니다</div>
            <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
          </div>
        </section>

        <!-- Result -->
        <section id="result" class="panel" aria-live="polite">
          <div class="fitbox">
            <div class="result-card">
              <div class="bottle">
                <img src="images/monthly-pick/makgeolli/omijasaeng.png" alt="문경주조 오미자생막걸리 병">
              </div>
              <div>
                <h3 class="r-title">오늘의 한 잔: 문경주조 오미자생막걸리</h3>
                <div class="r-tags">
                  <span class="tag">#오미자</span>
                  <span class="tag">#새콤달콤</span>
                  <span class="tag">#상큼청량</span>
                </div>
                <p class="r-desc">연분홍빛 오미자 향과 산미가 어우러진 산뜻한 한 잔. 차갑게 즐기면 향이 또렷해지고, 가벼운 안주와도 잘 맞아요.</p>
                <div class="actions">
                  <button class="btn primary" onclick="window.location.href='index.html#monthly-pick'">이 술 보러가기</button>
                  <button class="btn ghost" id="restart">다시 해보기</button>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- 라우팅/진행바 동기화 + 결과 자동 스케일 -->
  <script>
    const panels = {}; document.querySelectorAll('.panel').forEach(p=>panels[p.id]=p);
    const frame = document.getElementById('frame');
    const stageEl = document.querySelector('.stage');

    function setPercent(p){ document.documentElement.style.setProperty('--pct', p); }

    function fitResult(){
      const box = document.querySelector('#result .fitbox');
      if(!box) return;
      const H = stageEl.clientHeight;
      const need = box.scrollHeight;
      const scale = Math.min(1, (H - 16) / need);   // 여유 16px
      box.style.transform = (scale < 1) ? `scale(${scale})` : '';
    }

    function clearResultScale(){
      const box = document.querySelector('#result .fitbox');
      if(box) box.style.transform = '';
    }

    function show(id){
      const current = document.querySelector('.panel.show');
      if(current){
        current.classList.remove('show','flip-in');
        current.classList.add('flip-out');
        current.addEventListener('animationend', ()=>{ current.classList.remove('flip-out'); }, {once:true});
      }

      const el = panels[id];
      requestAnimationFrame(()=> el.classList.add('show','flip-in'));

      const isResult = (id === 'result');
      frame.classList.toggle('is-result', isResult);   // 프레임 높이 전환

      // 진행률
      if(id==="q1") setPercent(33);
      else if(id==="q2") setPercent(66);
      else if(id==="loading" || id==="result") setPercent(100);

      // 결과 진입/이탈 처리
      if(isResult){
        // height 전환이 끝난 뒤에만 스케일 계산 (작게 보였다가 커지는 현상 방지)
        const onDone = (e)=>{
          if(e.propertyName === 'height'){
            fitResult();
            frame.removeEventListener('transitionend', onDone);
          }
        };
        frame.addEventListener('transitionend', onDone);
      }else{
        // 결과에서 벗어날 때는 스케일 초기화
        clearResultScale();
      }
    }

    // 바인딩
    document.querySelectorAll('.choice').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const next = btn.dataset.next;
        if(next==='loading'){
          show('loading');
          setTimeout(()=> show('result'), 2000);  // 로딩 체감 필요시 2000 정도로
        }else{
          show(next);
        }
      });
    });

    document.getElementById('restart').addEventListener('click', ()=>{
      setPercent(0);
      show('q1');
    });

    window.addEventListener('load', ()=>{
      setPercent(0);
      setTimeout(()=> setPercent(33), 300);
    });

    window.addEventListener('resize', ()=>{
      // 결과 화면에서만 리사이즈 대응
      if(frame.classList.contains('is-result')) fitResult();
    });
  </script>

  <!-- 배경 버블 -->
  <script>
    Math.TWO_PI = Math.PI * 2;
    let canvas, ctx, bubbles = [];
    const section = document.querySelector(".shell");

    function Bubble(opts = {}) { this.init(opts); }
    Bubble.prototype = {
      init(opts = {}) {
        this.radius = Math.random() * 7;
        this.x = opts.x || Math.random() * canvas.width;
        this.y = opts.y || section.offsetHeight + this.radius;
        this.vx = Math.random() * 0.03;
        this.vy = 1 + Math.random() * 4;
        this.sway = 0.25 + Math.random() * 0.25;
        this.angle = Math.random() * Math.TWO_PI;
        this.opacity = 0.2 + Math.random() * 0.2;
        return this;
      },
      update(){
        this.x += Math.cos(this.angle)*this.sway;
        this.y -= this.vy;
        this.angle += this.vx;
        if(this.y + this.radius < 0) this.init({ y: section.offsetHeight + this.radius });
      },
      draw(){
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.radius,0,Math.TWO_PI);
        ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
        ctx.fill();
      },
      render(){ this.update(); this.draw(); }
    };

    function loop(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      bubbles.forEach(b=>b.render());
      requestAnimationFrame(loop);
    }
    function resize(){
      canvas.width = section.clientWidth;
      canvas.height = section.clientHeight;
    }

    (function init(){
      canvas = document.createElement("canvas");
      canvas.style.cssText = "position:absolute; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none;";
      section.appendChild(canvas);
      ctx = canvas.getContext("2d");
      resize();
      const num = Math.round(canvas.width * 0.125);
      for (let i=0;i<num;i++) bubbles.push(new Bubble({ x: Math.random()*canvas.width, y: Math.random()*canvas.height }));
      window.addEventListener("resize", resize);
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
